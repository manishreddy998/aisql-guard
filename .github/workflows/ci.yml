name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/aisql_guard
      - name: Test
        run: pytest --cov=aisql_guard --cov-report=term-missing

  install:
    name: Clean install, pip ${{ matrix.pip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pip: ["latest", "24.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select pip
        run: |
          if [ "${{ matrix.pip }}" = "latest" ]; then
            python -m pip install -U pip
          else
            python -m pip install "pip==${{ matrix.pip }}"
          fi
      - name: Install from the checkout
        run: python -m pip install .
      - name: Check the sample project
        run: |
          set +e
          aisql-guard check examples/support_tickets
          status=$?
          set -e
          test "$status" -eq 1
      - name: Run the tests
        run: |
          python -m pip install pytest
          pytest
