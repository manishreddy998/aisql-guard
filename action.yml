name: aisql-guard
description: Catch surprise costs from AI functions in SQL before the query runs
author: Manish Reddy
branding:
  icon: shield
  color: blue
inputs:
  command:
    description: scan, estimate, or check
    required: false
    default: check
  paths:
    description: SQL files or directories to read
    required: false
    default: .
  format:
    description: text, json, or sarif
    required: false
    default: sarif
  output:
    description: File that receives the report
    required: false
    default: aisql-guard.sarif
  config:
    description: Optional config file
    required: false
    default: ""
  dialect:
    description: Optional sqlglot dialect
    required: false
    default: ""
  fail-on:
    description: Lowest severity that fails the run. Leave empty to use the config.
    required: false
    default: ""
  live:
    description: Set to true to sample input tokens from BigQuery. Off by default.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install aisql-guard from this action
      shell: bash
      env:
        AISQL_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$AISQL_ACTION_PATH"
    - name: Run aisql-guard
      shell: bash
      env:
        AISQL_COMMAND: ${{ inputs.command }}
        AISQL_PATHS: ${{ inputs.paths }}
        AISQL_FORMAT: ${{ inputs.format }}
        AISQL_OUTPUT: ${{ inputs.output }}
        AISQL_CONFIG: ${{ inputs.config }}
        AISQL_DIALECT: ${{ inputs.dialect }}
        AISQL_FAIL_ON: ${{ inputs.fail-on }}
        AISQL_LIVE: ${{ inputs.live }}
      run: |
        set -euo pipefail
        read -r -a path_args <<< "$AISQL_PATHS"
        cmd=(aisql-guard "$AISQL_COMMAND" "${path_args[@]}" --format "$AISQL_FORMAT" --output "$AISQL_OUTPUT" --no-color)
        if [[ -n "$AISQL_CONFIG" ]]; then
          cmd+=(--config "$AISQL_CONFIG")
        fi
        if [[ -n "$AISQL_DIALECT" ]]; then
          cmd+=(--dialect "$AISQL_DIALECT")
        fi
        if [[ -n "$AISQL_FAIL_ON" ]]; then
          cmd+=(--fail-on "$AISQL_FAIL_ON")
        fi
        if [[ "$AISQL_LIVE" == "true" ]]; then
          cmd+=(--live)
        fi
        "${cmd[@]}"
