# Assumptions for the sample project. Row counts are not read from a warehouse.
dialect = "bigquery"

[rules]
fail_on = "error"

[estimate]
default_model = "google-3.5-flash-lite"
default_rows = 1000
default_input_tokens = 400
default_output_tokens = 128
default_thinking_tokens = 0

[estimate.models.ticket_summaries_risky]
rows = 50000
input_tokens = 1500
output_tokens = 512
thinking_tokens = 2048
model = "google-3.5-flash"

[estimate.models.capped_batch]
rows = 2000
input_tokens = 300
output_tokens = 200
thinking_tokens = 256

[budgets]
total_usd = "50"

[budgets.models]
ticket_summaries_risky = "100"
